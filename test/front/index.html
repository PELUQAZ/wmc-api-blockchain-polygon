<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactuar con el Contrato</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        h3 {
            text-align: center;
            color: black;
            margin-bottom: 30px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:read-only {
            background-color: #e9ecef;
        }

        button {
            padding: 10px 20px;
            background-color: #28a745;
            border: none;
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background-color: #218838;
        }

        button:active {
            background-color: #1e7e34;
        }

        .buttons {
            text-align: center;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85em;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3>Información del acuerdo</h3>

        <!-- Sección de datos -->
        <div class="grid-container">
            <div>
                <label for="servicePayer">Wallet pagador servicio:</label>
                <input type="text" id="servicePayer" placeholder="Wallet pagador" readonly>
            </div>
            <div>
                <label for="serviceProvider">Wallet proveedor servicio:</label>
                <input type="text" id="serviceProvider" placeholder="Wallet proveedor" readonly>
            </div>
            <div>
                <label for="arbitrator">Wallet árbitro:</label>
                <input type="text" id="arbitrator" readonly>
            </div>
            <div>
                <label for="startDate">Fecha inicio:</label>
                <input type="date" id="startDate">
            </div>
            <div>
                <label for="endDate">Fecha fin:</label>
                <input type="date" id="endDate">
            </div>
            <div>
                <label for="numHours">Nro. horas:</label>
                <input type="number" id="numHours" min="1" step="1" value="1">
            </div>
            <div>
                <label for="hourlyRate">Valor hora (USDC):</label>
                <input type="number" id="hourlyRate" min="0" step="0.01">
            </div>
            <div>
                <label for="agreementAmount">Monto acuerdo (USDC):</label>
                <input type="text" id="agreementAmount" readonly>
            </div>
            <div>
                <label for="arbitrateFee">Fee arbitraje: USDC $0.2</label>
            </div>
            <div>
                <label for="daoFee">Fee DAO: USDC $0.3</label>
            </div>
        </div>

        <!-- Botones -->
        <div class="buttons">
            <!--<button id="connectWallet">Conectar wallet</button>-->
            <br>
            <button id="createAgreement">Crear acuerdo</button>
        </div>

        <!-- Consultar acuerdo -->
        <div class="grid-container">
            <div>
                <label for="agreementId">ID acuerdo:</label>
                <input type="number" id="agreementId" min="0" step="1" placeholder="Ingresa ID del acuerdo">
                <button id="getAgreement">Consultar acuerdo</button>
                <!--<button id="payAgreement">Pagar acuerdo</button>-->
            </div>
        </div>

        <!-- Acciones en construcción -->
        <div class="buttons" style="margin-top: 10px;">
            <button id="disagreement">Desacuerdo</button>
            <button id="agreement">Acuerdo</button>
            <button id="resolveDisagreement">Resolver desacuerdo</button>
        </div>
    </div>

    <footer>
        &copy; 2025 - Interacción con contratos. Todos los derechos reservados.
    </footer>

    <script src="ethers.umd.min.js"></script>
    <script src="wmc-front-script.js"></script>
    <script src="wmc-front-calculation.js"></script>

</body>

</html>
